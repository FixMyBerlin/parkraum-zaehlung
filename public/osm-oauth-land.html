<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OSM OAuth</title>
  </head>
  <body>
    <script>
      ;(function () {
        var params = new URLSearchParams(location.search)
        if (!params.has('code') && !params.has('error')) return

        if (window.opener) {
          if (typeof window.opener.authComplete === 'function') {
            window.opener.authComplete(location.href)
          }
          window.close()
          return
        }

        var appBase = new URL('.', location.href)
        var appBasePrefix = appBase.pathname.replace(/\/$/, '') || ''
        var RETURN_KEY = '__osmAuthReturnUrl'
        var raw = localStorage.getItem(RETURN_KEY)
        localStorage.removeItem(RETURN_KEY)

        var appUrl = new URL(appBase.href)
        try {
          if (raw) {
            var candidate = new URL(raw, location.origin)
            var underBase =
              candidate.origin === location.origin &&
              (appBasePrefix === '' ||
                candidate.pathname === appBasePrefix ||
                candidate.pathname.indexOf(appBasePrefix + '/') === 0)
            if (underBase) appUrl = candidate
          }
        } catch (e) {
          appUrl = new URL(appBase.href)
        }

        ;['code', 'state', 'error', 'error_description'].forEach(function (key) {
          var value = params.get(key)
          if (value) appUrl.searchParams.set(key, value)
          else appUrl.searchParams.delete(key)
        })

        location.replace(appUrl.pathname + appUrl.search + appUrl.hash)
      })()
    </script>
  </body>
</html>
